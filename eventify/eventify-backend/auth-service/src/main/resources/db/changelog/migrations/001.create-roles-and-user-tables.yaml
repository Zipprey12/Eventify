databaseChangeLog:
  - changeSet:
      id: 1
      author: Zipprey
      comment: Создание таблицы ролей
      changes:
        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: varchar(30)
                  constraints:
                    unique: true
                    nullable: false

        - insert:
            tableName: user_roles
            columns:
              - column:
                  name: name
                  value: USER

        - insert:
            tableName: user_roles
            columns:
              - column:
                  name: name
                  value: ADMIN

  - changeSet:
      id: 2
      author: Zipprey
      comment: Создание таблицы пользователей
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: email
                  type: varchar(70)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: password_hash
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_role_user
                    references: user_roles(id)
                    nullable: false
