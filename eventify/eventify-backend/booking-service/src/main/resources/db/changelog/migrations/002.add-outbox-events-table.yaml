databaseChangeLog:
  - changeSet:
      id: 3
      author: zipprey
      comment: Таблица исходящих событий (Outbox Pattern)
      changes:
        - createTable:
            tableName: outbox_events
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: topic
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: key
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
                  defaultValue: READY
              - column:
                  name: payload_type
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: processed_at
                  type: timestamptz

        - sql:
            sql: >
              CREATE INDEX idx_outbox_events_active
              ON outbox_events (status, created_at)
              WHERE status IN ('PENDING_ENRICHMENT', 'READY');