server:
  port: 8083

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://localhost:5435/booking_db
    username: postgres
    password: postgres
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

internal:
  secret: ${BOOKING_INTERNAL_API_KEY}
  trusted-services:
    notification-service: ${NOTIFICATION_INTERNAL_API_KEY:}

event-service:
  base-url: http://event-service:8082

booking:
  expiry-batch-size: 50
  expiry-fallback-delay: 43200000