server {
    listen 8080;

    add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location /auth/ {
        proxy_pass http://auth-service:8081/auth/;
    }

    location /events {
        proxy_pass http://event-service:8082/events;
    }

    location /admin/events {
        proxy_pass http://event-service:8082/admin/events;
    }

    location /bookings {
        proxy_pass http://booking-service:8083/bookings;
    }

    location /admin/bookings {
        proxy_pass http://booking-service:8083/admin/bookings;
    }

    location /user/ {
        proxy_pass http://notification-service:8084/user/;
    }
}