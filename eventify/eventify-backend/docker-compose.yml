services:

  auth-postgres:
    image: postgres:16
    container_name: auth-postgres
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${AUTH_POSTGRES_USER} -d auth_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth-service
    container_name: auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${AUTH_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8081:8081"
    depends_on:
      auth-postgres:
        condition: service_healthy

  event-postgres:
    image: postgres:16
    container_name: event-postgres
    environment:
      POSTGRES_DB: event_db
      POSTGRES_USER: ${EVENT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${EVENT_POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - event_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${EVENT_POSTGRES_USER} -d event_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  event-redis:
    image: redis:7-alpine
    container_name: event-redis
    ports:
      - "6381:6379"
    volumes:
      - event_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  event-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: event-service
    container_name: event-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://event-postgres:5432/event_db
      SPRING_DATASOURCE_USERNAME: ${EVENT_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${EVENT_POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      BOOKING_INTERNAL_API_KEY: ${BOOKING_INTERNAL_API_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: event-redis
      REDIS_PORT: 6379
    ports:
      - "8082:8082"
    depends_on:
      event-postgres:
        condition: service_healthy
      event-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  booking-postgres:
    image: postgres:16
    container_name: booking-postgres
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: ${BOOKING_POSTGRES_USER}
      POSTGRES_PASSWORD: ${BOOKING_POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - booking_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${BOOKING_POSTGRES_USER} -d booking_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  booking-redis:
    image: redis:7-alpine
    container_name: booking-redis
    ports:
      - "6380:6379"
    volumes:
      - booking_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  booking-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: booking-service
    container_name: booking-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://booking-postgres:5432/booking_db
      SPRING_DATASOURCE_USERNAME: ${BOOKING_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${BOOKING_POSTGRES_PASSWORD}
      BOOKING_INTERNAL_API_KEY: ${BOOKING_INTERNAL_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: booking-redis
      REDIS_PORT: 6379
    ports:
      - "8083:8083"
    depends_on:
      booking-postgres:
        condition: service_healthy
      booking-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-postgres:
    image: postgres:16
    container_name: notification-postgres
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: ${NOTIFICATION_POSTGRES_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_POSTGRES_PASSWORD}
    ports:
      - "5436:5432"
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${NOTIFICATION_POSTGRES_USER} -d notification_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-redis:
    image: redis:7-alpine
    container_name: notification-redis
    ports:
      - "6379:6379"
    volumes:
      - notification_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: notification-service
    container_name: notification-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${NOTIFICATION_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      NOTIFICATION_INTERNAL_API_KEY: ${NOTIFICATION_INTERNAL_API_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: notification-redis
      REDIS_PORT: 6379
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    ports:
      - "8084:8084"
    depends_on:
      notification-postgres:
        condition: service_healthy
      notification-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - auth-service
      - event-service
      - booking-service
      - notification-service

  kafka-init:
    image: busybox
    volumes:
      - kafka_data:/tmp/kafka-logs
    command: [ "sh", "-c", "chown -R 1000:1000 /tmp/kafka-logs" ]

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/tmp/kafka-logs
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092" ]
      interval: 10s
      timeout: 10s
      retries: 5

  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafbat-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: eventify-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  auth_postgres_data:
  event_postgres_data:
  booking_postgres_data:
  notification_postgres_data:
  kafka_data:
  notification_redis_data:
  booking_redis_data:
  event_redis_data: